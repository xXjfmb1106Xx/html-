<!DOCTYPE html>
<html>
    <head>
        <title>Ejercicio Tablas</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>
    <body>
        <h1>Ejemplo de Tabla HTML</h1>
        <table border = 1>
            <tr>
                <td>Fila 1 celda 1</td>
                <td>Fila 1 celda 2</td>
            </tr>
            <tr>
                <td>Fila 2 celda 1</td>
                <td>Fila 2 celda 2</td>
            </tr>
        </table>
        <h1>TABLAS ASIMETRICAS </h1>
        <table border = 1>
            <tr>
                <th>Columna 1</td>
                <td>Columna 2</td>
                <td>Columna 3</td>
            </tr>
            <tr>
                <td rowspawn = "2" >Fila 1 celda 1</td>
                <td>Fila 2 celda 2</td>
                <td>Fila 2 celda 3</td>
            </tr>
            <tr>
                <td colspawn = "3">Fila 3 celda 1</td>
            </tr>
        </table>

        <table border = 1 cellspacing = "10">
            <tr>
                <th>Columna 1</th>
                <th>Columna 2</th>
            </tr>
            <tr>
                <td>Fila 1 celda 1</td>
                <td>Fila 2 celda 2</td>
            </tr>
        </table>
    </body>
